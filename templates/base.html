{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="{% static 'vitacare.svg' %}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
  <title>{% block title %}VitaCare{% endblock title %}</title>
</head>
<body>

  <header class="topbar">
    <div class="topbar-inner">
      <a href="{% url 'core:home' %}" class="logo">
        <img src="{% static 'vitacare.svg' %}" alt="" class="logo-mark">
        <span>Vita<em>Care</em></span>
      </a>

      <nav class="nav">

      </nav>
    </div>
  </header>

  <main class="main">
    {% if messages %}
      {% for message in messages %}
        <div class="alert alert-{{ message.tags }}">{{ message }}</div>
      {% endfor %}
    {% endif %}

    {% block body %}
    {% endblock body %}
  </main>

  <footer class="footer">VitaCare · Sistema de gestão de clínica médica</footer>

</body>
</html>
